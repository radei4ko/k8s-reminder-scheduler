# A throwaway password for a local kind cluster that nobody else can reach.
# It is committed in plain text the same way docker-compose.yml already
# commits "change_me" as its default - there is no real secret here to leak.
#
# What this is not a substitute for: in a cluster anyone else has access to,
# secret values do not belong in a YAML file in git at all, Secret or not -
# base64 is encoding, not encryption, anyone with `kubectl get secret -o yaml`
# or repo access reads it straight back out. That is what tools like
# Sealed Secrets, External Secrets Operator, or Vault's CSI driver are for:
# the encrypted or externally-fetched value lands in the cluster, never in
# git history.
apiVersion: v1
kind: Secret
metadata:
  name: mysql-credentials
  namespace: reminder-scheduler
type: Opaque
stringData:
  MYSQL_ROOT_PASSWORD: root_change_me
  MYSQL_USER: reminder_user
  MYSQL_PASSWORD: change_me
  MYSQL_DATABASE: reminder_scheduler
  DATABASE_URL: mysql+pymysql://reminder_user:change_me@mysql:3306/reminder_scheduler
