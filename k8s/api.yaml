apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: reminder-scheduler
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      containers:
        - name: api
          image: reminder-scheduler:local
          # The image is loaded straight into kind's node with `kind load
          # docker-image` (see Makefile) rather than pulled from a registry -
          # Never would mean "trust nothing else", IfNotPresent lets kubectl
          # apply survive a pod restart without needing a reload every time.
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: app-config
            - secretRef:
                name: mysql-credentials
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: reminder-scheduler
spec:
  type: NodePort
  selector:
    app: api
  ports:
    - port: 8000
      targetPort: 8000
      nodePort: 30080  # matched by k8s/kind-config.yaml's extraPortMappings
