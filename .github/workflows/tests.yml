name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root_ci
          MYSQL_DATABASE: reminder_scheduler_test
          MYSQL_USER: reminder_user
          MYSQL_PASSWORD: change_me
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -uroot -proot_ci"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        env:
          TEST_DATABASE_URL: mysql+pymysql://reminder_user:change_me@127.0.0.1:3306/reminder_scheduler_test
        run: pytest -q

      - name: Run the concurrency and fencing tests repeatedly
        # These exercise a race (SKIP LOCKED across real threads, lease expiry
        # vs. a late completion) - non-deterministic by nature, so one green
        # run proves little.
        env:
          TEST_DATABASE_URL: mysql+pymysql://reminder_user:change_me@127.0.0.1:3306/reminder_scheduler_test
        run: |
          for i in $(seq 1 10); do
            pytest tests/test_concurrency.py tests/test_fencing.py tests/test_lease_expiry.py -q || exit 1
          done
